#
# excel_export.conf - settings of the /services/excel_export endpoint.
# Do not edit this file: copy the settings you want to change into
# local/excel_export.conf. See README/excel_export.conf.spec.
#

[settings]
allow_search       = true
default_app        = search
job_timeout        = 300
page_size          = 50000
max_rows_per_sheet = 1048575
max_sheets         = 20
risky_commands     = collect, delete, dump, map, mcollect, meventcollect, outputcsv, outputlookup, outputtext, run, runshellscript, script, sendalert, sendemail, tscollect
