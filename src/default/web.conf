#
# web.conf - Splunk Excel Extraction
#
# Lets Splunk Web proxy browser calls to the endpoint:
#   /<locale>/splunkd/__raw/services/excel_export
#   /<locale>/splunkd/__raw/servicesNS/<user>/<app>/excel_export
#

[expose:excel_export]
pattern = excel_export
methods = GET, POST

[expose:excel_export_ns]
pattern = */*/excel_export
methods = GET, POST
