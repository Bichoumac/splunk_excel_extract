#
# restmap.conf - Splunk Excel Extraction
#
# Exposes /services/excel_export on splunkd. The handler runs with the session
# of the calling user (passSystemAuth = false), so an export never returns data
# the user could not search.
#

[script:excel_export]
match                 = /excel_export
script                = excel_export_handler.py
scripttype            = persist
handler               = excel_export_handler.ExcelExportHandler
requireAuthentication = true
output_modes          = json
passPayload           = true
passHttpHeaders       = true
passHttpCookies       = false
passSystemAuth        = false
python.version        = python3
